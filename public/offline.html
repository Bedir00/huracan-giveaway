<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Akquise CRM</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 2rem;
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #fafafb;
        color: #101114;
        text-align: center;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #0b0c0e; color: #f1f2f5; }
      }
      .mark {
        width: 44px; height: 44px; border-radius: 12px; background: #5b57d8;
        display: grid; place-items: center; color: #fff; font-weight: 700; margin: 0 auto 1rem;
      }
      p { color: #61667a; max-width: 24rem; }
      a { color: #5b57d8; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">A</div>
      <h1>Keine Verbindung</h1>
      <p>
        Die Akquise-App braucht eine Internetverbindung, um aktuelle Leads zu laden.
        Sobald du wieder online bist, funktioniert alles wie gewohnt.
      </p>
      <p><a href="/">Erneut versuchen</a></p>
    </main>
  </body>
</html>
